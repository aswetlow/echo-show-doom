<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Doom</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; }
  /* Doom is 4:3 (320x200 with aspect correction). On 1280x800 that is 1067x800, centered. */
  #canvas { position: absolute; top: 0; bottom: 0; left: 0; right: 0; margin: auto; height: 100vh; width: calc(100vh * 4 / 3); max-width: 100vw; max-height: calc(100vw * 3 / 4); display: block; background: #000; image-rendering: pixelated; outline: none; }
  #hud { position: absolute; top: 6px; left: 8px; color: #6f6; font: 14px/1.25 ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 3px #000; z-index: 2; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c33; font: bold 28px system-ui, sans-serif; z-index: 1; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="loading">Loading Doom ...</div>
<div id="hud"></div>
<!-- doom.wasm: built from jacobenget/doom.wasm (doomgeneric, GPL-2.0) + sound patch (port/), shareware doom1.wad embedded unmodified. See README. -->
<script src="sound.js"></script>
<script src="main.js"></script>
<script src="touch.js"></script>
</body>
</html>
