<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Doom feasibility probe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 16px/1.25 system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  #wrap { display: flex; height: 100%; }
  #left { flex: 1 1 62%; padding: 14px 18px; overflow: hidden; }
  #right { flex: 1 1 38%; padding: 14px 18px; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 22px; margin: 0 0 8px; color: #fff; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 2px 6px; vertical-align: top; border-bottom: 1px solid #222; }
  td.k { color: #999; white-space: nowrap; width: 1%; }
  td.v { word-break: break-word; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .ok { color: #6d6; } .warn { color: #fc4; } .fail { color: #f66; } .run { color: #79f; }
  #touch { flex: 1; flex-direction: column; border: 2px dashed #555; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; color: #aaa; position: relative; }
  .dot { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: rgba(120,160,255,.5); pointer-events: none; }
  .row { display: flex; gap: 12px; }
  button { flex: 1 1 0; font-size: 22px; padding: 18px 10px; border: 0; border-radius: 10px; background: #2a2a2a; color: #fff; }
  button.yes { background: #1f5f2a; } button.no { background: #6a2020; }
  #beep { flex: none; }
  #touchcount { display: block; margin-top: 8px; font-size: 28px; color: #fff; }
  #status { font-size: 16px; color: #aaa; min-height: 2.6em; }
</style>
</head>
<body>
<div id="wrap">
  <div id="left">
    <h1>Doom feasibility probe</h1>
    <table id="out"></table>
  </div>
  <div id="right">
    <div id="status">Waiting for the load event ...</div>
    <div id="touch">Multitouch test:<br>put 2&ndash;3 fingers here at once<br><span id="touchcount">max 0</span></div>
    <div>Did you hear a short beep?</div>
    <div class="row">
      <button class="yes" id="heardYes">Yes, beep</button>
      <button class="no" id="heardNo">No beep</button>
    </div>
    <button id="beep">Play beep again</button>
  </div>
</div>

<!-- ES5 watchdog: if the main script cannot even run (very old engine), still report what we can. -->
<script>
  window.__probeStarted = false;
  setTimeout(function () {
    if (window.__probeStarted) return;
    var x = new XMLHttpRequest();
    x.open('POST', '/report');
    x.setRequestHeader('Content-Type', 'application/json');
    x.send(JSON.stringify({ alexa: /alexa=1/.test(location.search), summary: { RESULT: 'main script did not start (syntax not supported?)', userAgent: navigator.userAgent } }));
    document.getElementById('status').textContent = 'Main script did not start. UA: ' + navigator.userAgent;
  }, 15000);
</script>
<script src="probe.js"></script>
</body>
</html>
